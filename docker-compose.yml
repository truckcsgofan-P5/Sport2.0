services:
  db:
    image: postgres:16-alpine
    container_name: sportstats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportstats
      POSTGRES_USER: sportstats
      POSTGRES_PASSWORD: sportstats_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sportstats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportstats -d sportstats"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sportstats_pgdata:
